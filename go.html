<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Парфюм опт</title>
<meta name="description" content="Оптовый каталог парфюмерии. Отправка по всей России.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="go.webmanifest">
<meta name="apple-mobile-web-app-title" content="Парфюм опт">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15120f">
<meta property="og:type" content="website">
<meta property="og:title" content="Парфюм опт — каталог">
<meta property="og:description" content="Оптовый каталог парфюмерии. Отправка по всей России.">
<meta property="og:image" content="https://belinskogo245-lgtm.github.io/shop/icon-512.png">
<meta property="og:url" content="https://belinskogo245-lgtm.github.io/shop/go.html">
<style>
:root{
  --bg:#15120f; --bg2:#241c14; --gold:#e3c27e; --gold2:#b8904a; --gold-deep:#8a6a33;
  --fg:#f3e9d6; --muted:#b3a58d; --ink:#1a140d;
  --f-serif:"Times New Roman",Georgia,"PT Serif",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg)}
body{
  font-family:var(--f-ui);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  background:
    radial-gradient(60% 45% at 50% 28%,rgba(227,194,126,.16),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg) 70%);
}
.wrap{width:100%;max-width:420px;text-align:center}
.icon{
  width:132px;height:132px;border-radius:30px;display:block;margin:0 auto 22px;
  box-shadow:0 0 0 1px rgba(227,194,126,.25),0 18px 50px rgba(0,0,0,.6),0 0 60px rgba(227,194,126,.18);
}
h1{font-family:var(--f-serif);font-weight:400;font-size:32px;letter-spacing:.06em;color:var(--gold)}
.sub{margin-top:8px;font-size:15px;color:var(--muted);letter-spacing:.02em}
.rule{width:64px;height:1px;margin:22px auto 26px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.btn{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:18px 18px;border-radius:20px;text-decoration:none;text-align:left;
  transition:transform .12s ease, filter .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.97)}
.btn + .btn{margin-top:14px}
.btn .ic{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center}
.btn .ic svg{width:28px;height:28px}
.btn b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.btn small{display:block;margin-top:3px;font-size:13.5px;line-height:1.3}
.btn .arr{margin-left:auto;flex:none;font-size:22px;opacity:.6}

.tg{background:linear-gradient(180deg,#f0d495,var(--gold) 45%,var(--gold2));color:var(--ink);
  box-shadow:0 10px 30px rgba(227,194,126,.28), inset 0 1px 0 rgba(255,255,255,.5)}
.tg .ic{background:var(--ink);color:var(--gold)}
.tg small{color:#4a3a22}

.web{background:rgba(227,194,126,.06);color:var(--fg);border:1.5px solid rgba(227,194,126,.45)}
.web .ic{background:rgba(227,194,126,.14);color:var(--gold)}
.web small{color:var(--muted)}

.foot{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.5}
.foot span{color:var(--gold)}
</style>
</head>
<body>
<main class="wrap">
  <img class="icon" src="icon-512.png" alt="Парфюм опт">
  <h1>ПАРФЮМ ОПТ</h1>
  <p class="sub">Оптовый каталог · отправка по всей России</p>
  <div class="rule"></div>

  <a class="btn tg" href="https://t.me/gsm_catalog_bot?startapp">
    <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 3.3 2.9 10.5c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.8-1.3-1.5Zm-3.4 4-8.9 8-.3 3.4-1.5-4.8 10.3-6.5c.5-.3.9-.1.4.4Z"/></svg></span>
    <span><b>Открыть в Telegram</b><small>Каталог в нашем боте</small></span>
    <span class="arr">›</span>
  </a>

  <a class="btn web" href="https://belinskogo245-lgtm.github.io/shop/">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg></span>
    <span><b>Открыть без Telegram</b><small>Работает без VPN, в любом браузере</small></span>
    <span class="arr">›</span>
  </a>

  <script>
  /* Сначала открываем Telegram напрямую (tg://) — так работает и с иконки на экране «Домой»;
     если Telegram не открылся за 1,5 с, переходим на обычную ссылку t.me */
  document.querySelector('.tg').addEventListener('click', function(e){
    e.preventDefault();
    var web = this.href, left = false;
    document.addEventListener('visibilitychange', function(){ if (document.hidden) left = true; }, {once:true});
    location.href = 'tg://resolve?domain=gsm_catalog_bot&startapp';
    setTimeout(function(){ if (!left) location.href = web; }, 1500);
  });
  </script>

  <p class="foot">Сохраните на экран «Домой» —<br>каталог всегда будет под рукой <span>✦</span></p>
</main>
</body>
</html>
