<script>/* Telegram SDK грузим только внутри Telegram, чтобы в браузере без VPN ничего не тормозило */
if (/tgWebApp/.test(location.hash + location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<style>
/* Layout: Telegram mini-app — баннер с «Каналом», поиск, вкладки категорий, сетка 3 в ряд, плавающее нижнее меню */
:root{
  --bg:#efeff4; --card:#ffffff; --fg:#111114; --muted:#7a7a85; --line:#dcdce3;
  --btn:#0d0d10; --btn-fg:#ffffff; --accent:#2f80ed; --accent-soft:#d9e6f8;
  --warn:#b4471d; --warn-soft:#fbe9df; --ok:#2e7d4f;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:"Russo One","Arial Black",var(--f-ui);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f12; --card:#1b1b20; --fg:#f2f2f5; --muted:#9a9aa6; --line:#2c2c34;
  --btn:#f2f2f5; --btn-fg:#0f0f12; --accent:#5aa0ff; --accent-soft:#1d2a3d;
  --warn:#ff9a6b; --warn-soft:#3a2219; --ok:#5fcf8d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f12; --card:#1b1b20; --fg:#f2f2f5; --muted:#9a9aa6; --line:#2c2c34;
  --btn:#f2f2f5; --btn-fg:#0f0f12; --accent:#5aa0ff; --accent-soft:#1d2a3d;
  --warn:#ff9a6b; --warn-soft:#3a2219; --ok:#5fcf8d; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.35;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-block:10px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;gap:8px;align-items:stretch}
.banner{flex:1;min-width:0;border-radius:12px;padding:10px 12px;display:flex;align-items:center;
  background:
   radial-gradient(circle at 8% 40%,#ff2fa0 0 18%,transparent 34%),
   radial-gradient(circle at 30% 80%,#ffcc00 0 14%,transparent 30%),
   radial-gradient(circle at 55% 20%,#00c2ff 0 16%,transparent 32%),
   radial-gradient(circle at 78% 70%,#7a3cff 0 15%,transparent 32%),
   radial-gradient(circle at 96% 30%,#ff6a00 0 14%,transparent 30%),#f4f4f6;}
.banner b{font-family:var(--f-display);font-weight:400;font-size:clamp(13px,3.6vw,18px);letter-spacing:.02em;color:#141414;
  text-shadow:0 0 6px #fff,0 0 2px #fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan{background:var(--btn);color:var(--btn-fg);border:0;border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;white-space:nowrap}
.chan svg{width:20px;height:20px}
.search{display:flex;gap:8px;align-items:center;margin-top:10px}
.search label{flex:1;display:flex;align-items:center;gap:8px;border:2px solid var(--fg);border-radius:12px;padding:8px 12px;background:var(--card)}
.search input{border:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--fg);outline:none}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:12px -10px 0;padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:6px 2px 10px;font-weight:700;font-size:17px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--fg)}
.tab[aria-selected="true"]{border-color:var(--fg)}
.meta{color:var(--muted);font-size:13px;margin:6px 2px 10px;display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
@media (max-width:340px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;gap:4px;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;border-radius:14px;background:var(--card);display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ph svg{width:46%;height:auto}
.ph .vol{position:absolute;left:6px;bottom:6px;font-size:11px;background:var(--bg);color:var(--muted);padding:2px 6px;border-radius:8px}
.ph .vol.vb{font-size:12px;font-weight:800;color:#fff;padding:3px 8px}
.vb.v155{background:#b8871a}.vb.v12{background:#2e73d9}.vb.v10{background:#26995a}
.vgrp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-weight:800;font-size:16px}
.vgrp span{color:#fff;border-radius:10px;padding:4px 12px}
.vgrp:after{content:"";flex:1;height:2px;background:var(--card)}
.price{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.art{font-size:12px;color:var(--muted);font-weight:600}
.name{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;word-break:break-word}
.add{margin-top:auto;background:var(--btn);color:var(--btn-fg);border:0;border-radius:12px;padding:9px 4px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px}
.add svg{width:17px;height:17px}
.add.in{background:var(--accent-soft);color:var(--accent)}
.add:disabled{background:var(--line);color:var(--muted);cursor:default}
.stepper{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px}
.stepper button{background:none;border:0;padding:8px 12px;font-size:18px;font-weight:700;color:var(--accent)}
.stepper span{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.more{display:block;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
h1{font-size:28px;margin:6px 2px 14px;text-wrap:balance}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .mini{width:52px;height:52px;flex:none;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.row .mini svg{width:55%}
.row .txt{flex:1;min-width:0}
.row .txt div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .txt div+div{color:var(--muted);font-size:13px}
.note{border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--accent-soft);color:var(--accent)}
.sum{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-top:12px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:8px}
.sum .total{font-weight:800;font-size:18px;border-top:1px solid var(--line);padding-top:8px}
.form{display:grid;gap:10px;margin-top:14px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.big{width:100%;background:var(--btn);color:var(--btn-fg);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin-top:6px}
.prof{display:flex;gap:12px;align-items:center;margin:6px 2px 14px}
.ava{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;background:linear-gradient(135deg,#ff2fa0,#7a3cff)}
.prof h2{margin:0;font-size:22px}
.prof p{margin:2px 0 0;color:var(--muted)}
.menu .row{font-weight:500}
.menu .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.menu .ic svg{width:20px;height:20px}
.chev{color:var(--muted)}
.info p{margin:0 0 10px;max-width:65ch}
.info h3{margin:16px 0 8px;font-size:17px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:6px;box-shadow:0 6px 24px rgb(0 0 0 / .12);z-index:5}
nav.bar button{background:none;border:0;width:62px;height:46px;border-radius:30px;display:grid;place-items:center;position:relative;color:var(--fg)}
nav.bar button[aria-current="page"]{background:var(--accent-soft)}
nav.bar svg{width:26px;height:26px}
.badge{position:absolute;top:4px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:6}
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .4);display:flex;align-items:flex-end;z-index:7}
.sheet>div{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px}
.promo{background:linear-gradient(135deg,#ff2fa0,#7a3cff);color:#fff;border-radius:var(--r);padding:12px 14px;margin:0 0 12px;font-size:14px}
.promo b{font-size:16px}
.promo .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.promo .tiers div{background:rgb(255 255 255 / .18);border-radius:10px;padding:6px 2px;font-size:12px;line-height:1.2}
.promo .tiers div.on{background:#fff;color:#7a3cff;font-weight:700}
.promo .tiers b{display:block;font-size:15px}
.ptag{font-size:11px;color:var(--muted);line-height:1.2}
.ptag.m15{color:#b8871a;font-weight:700}
.ptag.sale{color:#d4141c;font-weight:800}.ptag.sale s{color:var(--muted);font-weight:400;margin-right:4px}
.vb.vsale{background:#d4141c}
.promo.sale{background:linear-gradient(135deg,#d4141c,#8a0f14)}
.promo.sale .big-t{font-size:22px;font-weight:900;display:block;line-height:1.1}
.promo.m15p{background:linear-gradient(135deg,#d9a21b,#b8571a)}
.promo.m15p .tiers div.on{color:#b8571a}
.m15strip{display:block;width:100%;text-align:left;border:0;cursor:pointer}
.rub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note.gift{background:var(--card);color:var(--fg);border:1.5px solid #ff2fa0}
.note.gift b{color:#ff2fa0}
/* Акция «СПА у тебя дома» — подарок к заказу от 120 $ */
.spa{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-radius:var(--r);padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.35}
.spa .spa-t{font-size:20px;font-weight:900;display:block;line-height:1.15;margin-bottom:4px}
.spa .spa-row{display:flex;gap:10px;align-items:center}
.spa .spa-ims{display:flex;gap:6px;flex:none}
.spa .spa-ims img{width:54px;height:68px;object-fit:cover;border-radius:10px;border:2px solid rgb(255 255 255 / .7)}
.spa .spa-go{display:inline-block;margin-top:6px;font-weight:700;text-decoration:underline}
.spa-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.spa-pick button{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:6px;font-size:13px;line-height:1.25;cursor:pointer}
.spa-pick button[aria-pressed="true"]{border-color:#ec4899;box-shadow:0 0 0 2px #ec4899 inset}
.spa-pick img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.spa-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.spa-bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899)}
.spa-sheet{max-height:88vh;overflow:auto}
.spa-sheet .gal2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.spa-sheet .gal2 img{width:100%;border-radius:12px;display:block}
.spa-sheet p{margin:6px 0}
/* Акция «Лампа за предоплату» */
.lamp{display:flex;width:100%;text-align:left;border:0;cursor:pointer;background:#1b2350;color:#fff;border-radius:var(--r);margin:0 0 12px;padding:0;overflow:hidden;min-height:170px;font-size:13px;line-height:1.35}
.lamp .lamp-txt{flex:1;min-width:0;padding:14px 6px 14px 14px;display:flex;flex-direction:column;gap:6px}
.lamp .lamp-tag{align-self:flex-start;background:#8fa6ff;color:#111a45;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.lamp .lamp-t{font-size:20px;font-weight:900;line-height:1.15}
.lamp .lamp-s{color:#c9d1f5}
.lamp .lamp-go{margin-top:auto;font-weight:700;text-decoration:underline}
.lamp img{width:38%;max-width:170px;object-fit:cover;display:block;flex:none}
.note.gift.lampn{border-color:#2b5ce6}.note.gift.lampn b{color:inherit}
.lamp-gift{display:flex;gap:12px;align-items:center}
.lamp-gift img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.lamp-pay{display:grid;gap:8px}
.lamp-pay button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.lamp-pay button i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted)}
.lamp-pay button[aria-pressed="true"]{border-color:var(--accent)}
.lamp-pay button[aria-pressed="true"] i{border:7px solid var(--accent)}
.lamp-pay span{display:flex;flex-direction:column;gap:2px}
.lamp-pay small{font-size:13px;color:var(--muted)}.lamp-pay small.ok{color:var(--accent);font-weight:700}
.lamp-bar i{background:#2b5ce6}
.lamp-sheet{position:relative}
.lamp-sheet .lamp-main{width:100%;aspect-ratio:3/4;max-height:52vh;object-fit:cover;border-radius:16px;display:block;background:#1b2350}
.lamp-th{display:flex;gap:8px;margin-top:10px}
.lamp-th button{flex:1;padding:0;border:3px solid transparent;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--card)}
.lamp-th button[aria-pressed="true"]{border-color:var(--accent)}
.lamp-th img{width:100%;height:100%;object-fit:cover;display:block}
.lamp-box{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;display:grid;gap:6px;font-size:14px}
.lamp-x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:22px;z-index:2}
.note.gift select{width:100%;margin-top:6px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.note.gift label{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
.inv{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.inv h3{margin:0 0 6px;font-size:18px}
.inv p{margin:6px 0;font-size:14px}
.inv .lnk{font-size:13px;word-break:break-all;background:var(--bg);border-radius:10px;padding:8px 10px;margin:8px 0;user-select:all}
.inv .btns{display:flex;gap:8px}
.inv .btns .big{margin-top:0}
.inv .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;text-align:center}
.inv .stats div{background:var(--bg);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--muted)}
.inv .stats b{display:block;font-size:20px;color:var(--fg)}
.big.alt{background:var(--accent-soft);color:var(--accent)}
.ph,.name{cursor:pointer}
.ph .more-ph{position:absolute;right:6px;bottom:6px;font-size:11px;background:var(--bg);color:var(--muted);padding:2px 6px;border-radius:8px}
.pd{max-height:92vh;overflow-y:auto}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -2px 8px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img,.gal .one{flex:0 0 100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:14px;scroll-snap-align:center}
.gal .one{display:grid;place-items:center;background:var(--card)}
.gal .one svg{width:40%}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.pd h2{margin:4px 0 2px;font-size:20px;line-height:1.25}
.pd .desc{white-space:pre-line;font-size:15px;line-height:1.45;margin:10px 0 14px;max-width:65ch}
.pd .x{position:absolute;right:14px;top:12px;background:var(--card);border:0;border-radius:50%;width:36px;height:36px;font-size:20px;z-index:2}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>

<div id="app"></div>
<nav class="bar" aria-label="Меню">
  <button data-go="home" aria-label="Главная"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></button>
  <button data-go="cart" aria-label="Корзина"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 3h3l2.6 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L22 7H7.2"/><circle cx="10" cy="20" r="1.8"/><circle cx="18" cy="20" r="1.8"/></svg><span class="badge" id="badge" hidden>0</span></button>
  <button data-go="info" aria-label="Информация"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12.4 7.2a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0zM10 10.5h3.2l-1.3 6.3h1.3" stroke="var(--card)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
  <button data-go="profile" aria-label="Профиль"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 21c.6-4.6 4.4-7.5 9-7.5s8.4 2.9 9 7.5z"/></svg></button>
</nav>

<script>
/* ===== НАСТРОЙКИ МАГАЗИНА ===== */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbysDIVdkJbYzcfpMO5a8AwE7MOqRdKMN803f0lgjVwKPvRE-rcHGzESyYckJ2-pvYXnhg/exec",                       // адрес Google Apps Script (каталог + приём заказов). Пусто = демо-данные
  CHANNEL_URL: "https://t.me/opt_opt_opt_parfume",
  SHOP_TITLE: "Духи парфюмерия косметика ОПТом",
  SHOP_HANDLE: "@opt_opt_opt_parfume",

const fold = s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()

    if (n.startsWith(p) && (p.endsWith(" ") || n.length===p.length || !/[0-9a-zа-яё]/.test(n[p.length]))){ b = fold(br); break; }

function calc(){

  const kq = usd.reduce((s,l)=>s+(isKraft(l.it)?l.n:0),0);
  const mq = usd.reduce((s,l)=>s+(isM15(l.it)?l.n:0),0);
  const base = usd.reduce((s,l)=>s+unitPrice(l.it,kq,mq)*l.n,0);
  const opt = base>=CONFIG.MIN_WHOLESALE;
  const extra = opt?0:usd.reduce((s,l)=>s+(isSale(l.it)?0:isTester(l.it)?CONFIG.SURCHARGE_TESTER:CONFIG.SURCHARGE_OTHER)*l.n,0);

  const totalRub = qtyRub*rubUnit;
  const gross = base+totalRub+extra;
  const disc = S.me&&S.me.discount ? Math.round(gross*(S.me.pct||3))/100 : 0;
  const sq = lines.reduce((s,l)=>s+(isSale(l.it)?l.n:0),0), saleBlock = sq>0 && base+totalRub<CONFIG.MIN_WHOLESALE;
  return {sq,saleBlock,kq,mq,lines,usd,rubL,base:base+totalRub,usdBase:base,opt,extra,gross,disc,total:Math.round((gross-disc)*100)/100,qty,qtyRub,rubUnit,totalRub};
}

function invoiceRub(o,rate){
  const lines=String(o.lines||"").split("\n").filter(Boolean);
  let sum=0;
  const out=lines.map((l,k)=>{ const m=l.match(/^(.*?) × (\d+) = ([\d.,]+) \$$/);
    if(!m||!rate) return (k+1)+". "+l;
    const q=+m[2], usd=parseFloat(m[3].replace(",",".")), rub=Math.round(usd*rate); sum+=rub;
    return `${k+1}. ${m[1]} — ${q} шт × ${Math.round(usd/q*rate).toLocaleString("ru-RU")} ₽ = ${rub.toLocaleString("ru-RU")} ₽`; });
  const tot = rate ? Math.round(o.total*rate) : 0;
  return `Накладная по заказу №${o.num} от ${o.date}\n${o.name} ${o.contact}\n${o.city}${o.note?"\n"+o.note:""}\n\n`+out.join("\n")+
    `\n\nВсего: ${o.qty} шт.`+(o.extra&&rate?`\nНаценка (заказ ниже 120 $): ${Math.round(o.extra*rate).toLocaleString("ru-RU")} ₽`:"")+
    (rate?`\nИтого к оплате: ${tot.toLocaleString("ru-RU")} ₽ (курс ${rate} ₽/$, ${money(o.total)})`:`\nИтого: ${money(o.total)}`);
}

    <div class="chips"><button class="chip" data-f="stock" aria-pressed="${S.inStock}">Только в наличии</button></div>
    <div style="color:var(--muted);font-size:13px">Сортировка</div>
    <div class="chips"><button class="chip" data-s="" aria-pressed="${!S.sort}">Как в прайсе</button><button class="chip" data-s="asc" aria-pressed="${S.sort==="asc"}">Сначала дешевле</button><button class="chip" data-s="desc" aria-pressed="${S.sort==="desc"}">Сначала дороже</button></div>
    <button class="big" data-close>Показать</button></div>`; };
  draw(); document.body.appendChild(sh);
  sh.addEventListener("click",e=>{ const t=e.target.closest("button");
    if(e.target===sh||t?.dataset.close!==undefined&&t){ sh.remove(); S.shown=CONFIG.PAGE; render(); return; }
    if(t?.dataset.f){S.inStock=!S.inStock;draw();} if(t&&t.dataset.s!==undefined){S.sort=t.dataset.s;draw();} });
}
/* Ссылка на страницу заказа с фото (order.html) — уходит продавцу кнопкой «Открыть заказ» */
function orderLink(o){
  const u=tgUser();
  const data={n:o.num,d:o.date,t:o.total,x:o.extra||0,
    c:{name:o.customer.name,contact:o.customer.contact,city:o.customer.city,note:o.customer.note,tgu:u.user||"",tgid:u.id||""},
    i:o.items.map(l=>[l.id,l.qty,l.price,String(l.name).slice(0,40)])};
  const bytes=new TextEncoder().encode(JSON.stringify(data)); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  const b64=btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return new URL("order.html?o="+b64, location.href.split(/[?#]/)[0]).href;
}
async function submitOrder(e){
  e.preventDefault();
  const c=calc(), btn=e.target.querySelector("button[type=submit]");
  if(c.saleBlock||!btn){ toast(`Акция действует при заказе от ${CONFIG.MIN_WHOLESALE} $. Добавьте ещё товаров`); return; }
  if(spaOk(c)&&!spaPicked()){ toast("Выберите аромат подарка — Лаванда или Персик"); const pk=document.querySelector(".spa-pick"); if(pk) pk.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const spa=spaOk(c)?spaPicked():null;
  const lampOn=lampOk(c), lamp=lampGift(c);
  const order={ date:new Date().toLocaleString("ru-RU"), customer:{name:$("#f-name").value.trim(),contact:$("#f-phone").value.trim(),city:[$("#f-city").value.trim(),$("#f-tk").value].filter(Boolean).join(", "),
      note:[lamp?"💳 ОПЛАТА ДО СБОРКИ — 🎁 ПОДАРОК: "+CONFIG.LAMP.name:lampOn?"Оплата после сборки (без лампы)":"",spa?"🎁 ПОДАРОК: "+spa.name:"",$("#f-fio").value.trim()?"Получатель: "+$("#f-fio").value.trim():"",$("#f-note").value.trim()].filter(Boolean).join(". "),tg:tgUser()},
    items:c.lines.map(l=>isPromo(l.it)?({id:l.it.id,name:l.it.name+" (акция 62 мл)",cat:l.it.cat,price:c.rubUnit,qty:l.n}):({id:l.it.id,name:l.it.name+(isSale(l.it)?" ("+l.it.vol+", акция −"+salePct(l.it)+"%)":l.it.cat===CONFIG.MINI.cat&&l.it.vol?" ("+l.it.vol+")":""),cat:l.it.cat,price:unitPrice(l.it,c.kq,c.mq),qty:l.n})).concat(spa?[{id:spa.id,name:"🎁 ПОДАРОК (акция СПА): "+spa.name,cat:"Подарок",price:0,qty:1}]:[]).concat(lamp?[{id:CONFIG.LAMP.id,name:"🎁 ПОДАРОК за предоплату: "+CONFIG.LAMP.name,cat:"Подарок",price:0,qty:1}]:[]), base:c.base, extra:c.extra, total:c.total, qty:c.qty, opt:c.opt,
    promoQty:c.qtyRub, promoUnit:c.rubUnit, sumText:sumTxt(c), disc:c.disc,
    gifts:giftSlots(c).map(sl=>{ const it=ITEMS.find(x=>String(x.id)===String(S.gp[sl.key])); return {type:sl.type,id:it?it.id:"",name:it?it.name:""}; }) };
  order.num=String(Date.now()).slice(-6);
  CUST={name:$("#f-name").value.trim(),contact:$("#f-phone").value.trim(),city:$("#f-city").value.trim(),tk:$("#f-tk").value,fio:$("#f-fio").value.trim()}; store.set("cust",CUST);
  btn.disabled=true; btn.textContent="Отправляем…";
  if(!CONFIG.API_URL){ btn.disabled=false; btn.textContent="Оформить заказ на "+sumTxt(c); toast("Демо-режим: заказ не отправлен, подключим бота следующим шагом"); return; }
  try{
    const r=await fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify({action:"order",order,initData:tg?tg.initData:""})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"Ошибка");
    S.orders.push({date:order.date,qty:c.qty,total:c.total,sum:sumTxt(c),status:"принят, ждёт подтверждения"}); store.set("orders",S.orders);
    S.cart={}; store.set("cart",S.cart); S.gp={}; store.set("gp",S.gp); S.view="profile"; render(); toast(lamp?"Заказ отправлен. Пришлём реквизиты — оплатите до сборки, и лампа ваша":"Заказ отправлен. Мы свяжемся с вами в Telegram"); loadMe();
  }catch(err){ btn.disabled=false; btn.textContent="Оформить заказ на "+sumTxt(c); toast("Заказ не ушёл: проверьте интернет и нажмите ещё раз"); }
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){ const act=a.dataset.act, link=inviteLink();
    if(act==="share"){ const txt="Оптовый каталог парфюмерии — флакон 62 мл в подарок к первому заказу по моей ссылке"; const u="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(txt);
      try{ tg?tg.openTelegramLink(u):window.open(u,"_blank"); }catch(err){ window.open(u,"_blank"); } }
    else if(act==="copy"){ (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast("Ссылка скопирована"),()=>toast("Выделите ссылку и скопируйте")); }
    else if(act==="orders"){ S.view="orders"; S.adminOrders=null; render(); window.scrollTo(0,0); api({action:"orders"}).then(j=>{S.adminOrders=j;render();}).catch(()=>{S.adminOrders={ok:false};render();}); }
    else if(act==="partners"){ S.view="partners"; S.partners=null; render(); window.scrollTo(0,0); api({action:"partners"}).then(j=>{S.partners=j;render();}).catch(()=>{S.partners={ok:false};render();}); }
    return; }
  const inv=e.target.closest("[data-inv]");
  if(inv&&S.adminOrders&&S.adminOrders.rows){ const o=S.adminOrders.rows[+inv.dataset.inv], txt=invoiceRub(o,S.adminOrders.rate||S.rate);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Накладная в рублях скопирована"),()=>prompt("Скопируйте накладную:",txt)); return; }
  const t=e.target.closest("[data-go],[data-cat],[data-inc],[data-dec],[data-open],#more,#filt"); if(!t) return;
  if(t.dataset.open){ openProduct(t.dataset.open); return; }
  if(t.dataset.go){ closeProduct(); S.view=t.dataset.go; render(); window.scrollTo(0,0); }
  else if(t.dataset.cat){ S.cat=t.dataset.cat; S.shown=CONFIG.PAGE; render(); }
  else if(t.dataset.inc){ setCart(t.dataset.inc,1); }
  else if(t.dataset.dec){ setCart(t.dataset.dec,-1); }
  else if(t.id==="more"){ S.shown+=CONFIG.PAGE; render(); }
  else if(t.id==="filt"){ openFilter(); }
});
document.addEventListener("click",e=>{ const sp=e.target.closest("[data-spapick]"); if(sp){ S.gp.spa=sp.dataset.spapick; store.set("gp",S.gp); haptic(); render(); return; } if(e.target.closest("[data-spa]")) spaSheet();
  const lp=e.target.closest("[data-lamppay]"); if(lp){ S.gp.lampPay=lp.dataset.lamppay; store.set("gp",S.gp); haptic(); render(); return; } if(e.target.closest("[data-lamp]")) lampSheet(); });
document.addEventListener("change",e=>{ const g=e.target.closest("[data-gift]"); if(g){ S.gp[g.dataset.gift]=g.value; store.set("gp",S.gp); } });
$("#app").innerHTML='<div class="empty">Загружаем каталог…</div>';
load();
</script>
